name: Deploy to GitHub Pages

# Собирает статику и публикует её на GitHub Pages.
# base-path берётся из имени репозитория: /<repo>/ — это путь project pages.
# 404.html и .nojekyll генерируются сборкой (см. vite.config.ts → pagesFallback).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check and build
        env:
          BASE_URL: /${{ github.event.repository.name }}/
        run: yarn build

      - name: Docs check (внутренняя документация; в CI — skip)
        run: python3 scripts/check_docs.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
