<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<title>Цифровой деканат · МГИМО</title>
		<script>
			/*
			 * SPA-fallback для статических хостингов (GitHub Pages, S3 и т.п.):
			 * неизвестный путь отдаётся как 404.html. Сохраняем путь и уводим на index,
			 * чтобы BrowserRouter восстановил маршрут из адресной строки.
			 */
			(function () {
				var segment = window.location.pathname.replace(/^\/digitalMgimo\/?/, '');
				var search = window.location.search || '';
				var hash = window.location.hash || '';
				var target = '/digitalMgimo/' + (segment ? '#' + segment + search + hash : '');
				window.location.replace(target);
			})();
		</script>
	</head>
	<body>
		<p>Перенаправление… Если ничего не произошло, <a href="/">вернитесь на главную</a>.</p>
	</body>
</html>
